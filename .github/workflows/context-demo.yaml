name: Context Variables Demo
on: push
jobs:
  context-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Use Context Variables
        run: |
          echo "This workflow is triggered by ${{ github.actor }}"
          echo "The respository name is ${{ github.repository }}"
          echo "The branch name is ${{ github.ref_name }}"

      - name: Print all variables under github
        run: echo "${{ toJson(github) }}"

      - name: Print Environmant variables
        run: Printenv
